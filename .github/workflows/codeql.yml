name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # The weekly run matters more than the per-PR run: a fresh checkout with no
  # new code gives CodeQL nothing new to learn, so scheduled runs are where it
  # actually surfaces findings.
  schedule:
    - cron: '27 4 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # JavaScript/TypeScript is a BUILD-LESS language for CodeQL — it parses
      # the source directly, so there is no compile step to trace. Do NOT set
      # `build-mode`; the default (`none`) is the only mode it supports.
      # Setting `build-mode: manual` fails at database init with:
      #   "JavaScript/TypeScript does not support the manual build mode."
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
