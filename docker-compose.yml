services:
  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379

      UPSTREAM_HOST: stub
      UPSTREAM_PORT: 3001
      UPSTREAM_INSTANCES: 3
    # NET_ADMIN grants network administration Does NOT make the container root
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      stub:
        condition: service_healthy
    ports:
      # Bound to loopback only. Laptop B reaches the proxy over a Tailscale tunnel rather than a LAN portforward
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7
    # expose, not ports: reachable from the compose network, NOT published to LAN.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  stub:
    build:
      context: .
      dockerfile: apps/stub/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
