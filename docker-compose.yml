services:
  proxy:
    image: lambda/proxy:dev
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379

      UPSTREAM_HOST: stub
      UPSTREAM_PORT: 3001
      UPSTREAM_INSTANCES: 3
      # host NIC is not visible inside the container. Capture runs on the
      # host; disabling it here keeps the proxy from logging a missing-device
      # error on every start.
      CAPTURE_IFACE: ""
      # A8: certs are mounted read-only; host paths from .env do not exist in
      # the container. TLS stays off until TLS_ENABLED=true is set in .env.
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_CERT_FILE: /certs/secure.example.pem
      TLS_KEY_FILE: /certs/secure.example-key.pem
      TLS_SNI_ROUTES: '[{"host":"secure.example","mode":"decrypt","group":"api"},{"host":"tunnel.example","mode":"passthrough","target":"host.docker.internal:8444"}]'
    volumes:
      - ./certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NET_ADMIN grants network administration Does NOT make the container root
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      stub:
        condition: service_healthy
    ports:
      # Bound to loopback only. Laptop B reaches the proxy over a Tailscale tunnel rather than a LAN portforward
      - "127.0.0.1:8080:8080"
      # A8: TLS gateway. Still loopback-only; TLS is off unless TLS_ENABLED=true.
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7
    # expose, not ports: reachable from the compose network, NOT published to LAN.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  stub:
    image: lambda/stub:dev
    build:
      context: .
      dockerfile: apps/stub/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Three replicas get three distinct host ports; the proxy reaches them
      # by DNS inside the compose network.
      - "127.0.0.1:3001-3003:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  dashboard:
    image: lambda/dashboard:dev
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DASHBOARD_PORT: 3000
      PROXY_EXPORT_URL: http://proxy:8080
      DASHBOARD_SERVICES: '[{"name":"proxy","url":"http://proxy:8080","healthPath":"/health"},{"name":"dashboard","url":"http://127.0.0.1:3000","healthPath":"/api/time"},{"name":"stub","url":"http://stub:3001","healthPath":"/health"},{"name":"redis","url":"redis://redis:6379"}]'
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
